name: Mobile Release

# Publica un APK de Android como GitHub Release.
# Se ejecuta al subir un tag de versión semántica (por ejemplo v1.0.0)
# o manualmente desde la pestaña Actions.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (por ejemplo v1.0.0)"
        required: true

permissions:
  contents: write

env:
  API_BASE_URL: https://carestacks-backend-api.onrender.com

jobs:
  release:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (production API)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/careconnect-${{ steps.version.outputs.tag }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CareConnect Mobile Release ${{ steps.version.outputs.tag }}
          body: |
            Android APK of CareConnect (caregiver app) connected to the production RESTful API:
            ${{ env.API_BASE_URL }}

            Built from commit ${{ github.sha }} by GitHub Actions.
          files: build/app/outputs/flutter-apk/careconnect-${{ steps.version.outputs.tag }}.apk
          make_latest: true
