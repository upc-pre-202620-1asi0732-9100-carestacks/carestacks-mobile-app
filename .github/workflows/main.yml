name: Mobile CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Validate Flutter Mobile App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests if available
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found. Skipping Flutter tests."
          fi

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Show generated APK
        if: success()
        run: |
          echo "Flutter Mobile build completed successfully."
          find build/app/outputs/flutter-apk -type f -name "*.apk"
