name: Mobile CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Show environment versions
        run: |
          java -version
          gradle --version

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Show generated APK
        if: success()
        run: |
          echo "Android build completed successfully."
          find app/build/outputs/apk/debug -type f -name "*.apk"
